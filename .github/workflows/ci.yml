name: nodeJS deployment to EC2

on: push

env: 
    CONTAINER_REGISTRY: docker.io
    DOCKER_USERNAME: nirnay2001
    IMAGE_NAME: nodejs-github

jobs: 
    Docker:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v7

            - name: Docker check
              run : docker --version

            - name: Docker build
              run: sudo docker build -t ${{env.IMAGE_NAME}}:latest .
            
            - name: Docker image validation
              run: sudo docker images

            - name: Docker login
              run: sudo docker login --username=${{env.DOCKER_USERNAME}} --password=Nirnay@2001

            - name: Docker info
              run: sudo docker info

            - name: Docker tag 
              run: sudo docker tag ${{env.IMAGE_NAME}}:latest ${{env.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest

            - name: Docker push to repo
              run: sudo docker push ${{env.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest

    Deploy:
      needs: Docker
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v7

        - name: Validate docker compose version
          run: sudo docker compose version
          

      
            
      
              