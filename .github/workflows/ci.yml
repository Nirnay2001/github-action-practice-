name: nodeJS deployment to EC2

on: push

jobs: 
    Test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v7

            - name: Execute shell script
              run: |
                chmod +x nodeJS-install.sh
                ./nodeJS-install.sh

            - name: Checkout nodeJS
              run: |
                npm --version
                node --version

            - name: Install dependency
              run: npm install

            - name: Start unit test
              run: npm test
            