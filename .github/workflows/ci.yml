name: nodeJS deployment to EC2

on: push

jobs: 
    Install:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v7

            - name: Execute shell script
              run: |
                chmod +x nodeJS-install.sh
                ./nodeJS-install.sh

            - name: Checkout nodeJS
              run: |
                npm --version
                node --version

            - name: Install dependency
              run: npm install
    
    Test:
      needs: Install
      runs-on: ubuntu-latest
      steps:
        - name: Run unit test
          run: npm test
        
            