name: nodeJS deployment to EC2

on: push
  #workflow_dispatch:  
  #schedule:
  #  - cron: "*/5 * * * *"




jobs: 
    Docker:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v7

            - name: Docker check
              run : docker --version

            - name: Docker build
              run: sudo docker build -t ${{secrets.IMAGE_NAME}}:latest .
            
            - name: Docker image validation
              run: sudo docker images

            - name: Docker login
              run: sudo docker login --username=${{secrets.DOCKER_USERNAME}} --password=${{secrets.DOCKER_PASSWORD}}

            - name: Docker info
              run: sudo docker info

            - name: Docker tag 
              run: sudo docker tag ${{secrets.IMAGE_NAME}}:latest ${{secrets.DOCKER_USERNAME}}/${{secrets.IMAGE_NAME}}:latest

            - name: Docker push to repo
              run: sudo docker push ${{secrets.DOCKER_USERNAME}}/${{secrets.IMAGE_NAME}}:latest

    Deploy:
      if: github.ref == 'refs/heads/main'
      needs: Docker
      timeout-minutes: 15
      
      strategy:
        max-parallel: 3
        matrix:
          os: [ubuntu-latest, Ubuntu 25.10, Ubuntu 18.04 LTS]
      concurrency: 
        group: production-deploy
        cancel-in-progress: false
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repo
          uses: actions/checkout@v7

        - name: Docker compose pull
          run: sudo docker compose pull

        - name: Docker compose up
          run: sudo docker compose up -d

        - name: Install test dependency 
          run: |
            chmod +x nodeJS-install.sh
            ./nodeJS-install.sh
        
        - name: Run test
          run: npm test



      
            
      
              