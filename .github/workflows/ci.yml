name: nodeJS deployment to EC2

on: push

jobs: 
    Install:
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v7

            - name: Execute shell script
              run: |
                chmod +x nodeJS-install.sh
                ./nodeJS-install.sh

            - name: Checkout nodeJS
              run: |
                npm --version
                node --version
            
            - name: Upload Dependencies
              uses: actions/upload-artifact@v4
              with:
                name: node-dependencies
                path: node_modules/

    
    Test:
      needs: Install
      runs-on: ubuntu-latest
      steps:
        - name: checkout repo
          uses: actions/checkout@v7

        - name: Download Dependencies
          uses: actions/download-artifact@v4
          with:
            name: node-dependencies
            path: node_modules/
        
        - name: Download projec dependency
          run: npm install

        - name: Run unit test
          run: npm test
        
            